<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Looping</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}
#player {
    width: 100vw;
    height: 100vh;
    border: 0;
    display: block;
    background: #000;
}
#start {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 22px;
    cursor: pointer;
    z-index: 10;
}
#start span {
    padding: 18px 28px;
    border: 1px solid #777;
    border-radius: 10px;
}
</style>
</head>
<body>

<div id="start"><span>▶ Klik / tekan OK untuk mulai</span></div>

<iframe id="player"
        allow="autoplay; fullscreen"
        allowfullscreen
        src="about:blank">
</iframe>

<script>
const videos = [
    "https://drive.google.com/file/d/1FdTgd8T4raMFVbfTtX98M5GLQYMgOgVk/preview",
    "https://drive.google.com/file/d/1JwWhALagE1ifqHvf-Omi_OurIfXjKBCe/preview",
    "https://drive.google.com/file/d/1KxGBbHQFQkYTWqB950ftc4ValpMty6GQ/preview",
    "https://drive.google.com/file/d/1MKnvsDbkZxJSnLv7n-vaHqC-dEI128Wg/preview",
    "https://drive.google.com/file/d/1bRtNx-o814C-MmASIflStRPj6Iq2X1lv/preview",
    "https://drive.google.com/file/d/1ipEd6PWxPyiBJ6LKg-EdbpMTpBPDdhUZ/preview",
    "https://drive.google.com/file/d/1rUcfKzFiGhdjIu5xk_69h_588Wr54vRi/preview"
];

let current = 0;
const player = document.getElementById("player");
const start = document.getElementById("start");

function playVideo(index) {
    current = index % videos.length;
    player.src = videos[current];
}

// Mulai saat layar diklik / tombol OK/Enter/Space ditekan
function startPlaylist() {
    start.style.display = "none";
    playVideo(0);
}

start.addEventListener("click", startPlaylist);

document.addEventListener("keydown", function(e) {
    if (e.key === "Enter" || e.key === " " || e.key === "ArrowRight") {
        startPlaylist();
    }
});

// Google Drive Preview tidak menyediakan event "ended" ke halaman induk.
// Karena itu, halaman akan mencoba lanjut berdasarkan durasi yang diberikan
// setelah durasi video diketahui. Jika video tidak memberikan durasi,
// tombol/remote masih dapat digunakan untuk membuka video berikutnya.
player.addEventListener("load", function() {
    // Tidak melakukan reload otomatis di sini agar iframe Google Drive
    // tidak terus-menerus dimuat ulang.
});
</script>

</body>
</html>
